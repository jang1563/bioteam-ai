name: Bug Report
description: Report a bug or unexpected behavior
labels: ["bug"]
body:
  - type: textarea
    id: description
    attributes:
      label: Description
      description: A clear description of the bug.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      description: How to reproduce the issue.
      placeholder: |
        1. Start the backend with `uv run uvicorn ...`
        2. Send a POST request to `/api/v1/...`
        3. Observe error in ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What you expected to happen.
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual Behavior
      description: What actually happened. Include error messages or logs.
    validations:
      required: true

  - type: dropdown
    id: component
    attributes:
      label: Component
      options:
        - Backend (API/Agents/Workflows)
        - Frontend (Dashboard)
        - Digest Pipeline
        - Docker/Deployment
        - Benchmarks (W6/W8/W9)
        - Other
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Python version, Node version, OS, etc.
      placeholder: |
        - Python: 3.12.x
        - Node: 22.x
        - OS: macOS / Ubuntu / Windows
    validations:
      required: false
